                                <p className="section-lbl">Contact checklist</p>
                                {[
                                    ['cardObtained', 'Business card obtained', 'Or owner/manager name confirmed', true],
                                    ['painPoints', 'Current POS pain points discussed', 'Note what they complained about', false],
                                    ['dmConfirmed', 'Decision maker confirmed', 'Are they the final buyer?', false],
                                    ['followUpPerm', 'Follow-up permission granted', 'OK to call or visit again?', false],
                                ].map(([field, title, sub, isCamera]) => (
                                    <div key={field} className="survey-item" onClick={() => toggleSurvey(field)}>
                                        <div className={`fp-check ${wData.survey[field] ? 'active' : ''}`}>
                                            {wData.survey[field] && <I n="check" size={10} style={{ color: '#fff' }} />}
                                        </div>
                                        <div style={{ flex: 1 }}>
                                            <p style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-primary)' }}>{title}</p>
                                            <p style={{ fontSize: 12, color: 'var(--text-tertiary)', marginTop: 2 }}>{sub}</p>
                                            {field === 'cardObtained' && wData.survey.businessCardPhoto && (
                                                <img src={wData.survey.businessCardPhoto} style={{ width: 64, height: 40, objectFit: 'cover', borderRadius: 8, marginTop: 6, border: '1px solid var(--border)' }} />
                                            )}
                                        </div>
                                        {isCamera && (
                                            <button onClick={e => { e.stopPropagation(); showToast('Opening camera…'); setTimeout(() => { setWData(p => ({ ...p, survey: { ...p.survey, cardObtained: true, businessCardPhoto: 'https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=200&q=80' } })); showToast('Business card captured'); }, 800); }}
                                                style={{ width: 30, height: 30, borderRadius: '50%', background: 'var(--surface-dim)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0, color: 'var(--text-tertiary)' }}>
                                                <I n="camera" size={13} />
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}

                {isColdVisit && wizardStep === 4 && (
                    <div className="screen-fade" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                        <div className="card screen-fade" style={{ padding: 16 }}>
                            <p className="section-lbl">Pain points identified</p>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                                {[
                                    ['stopwatch', 'Slow billing'],
                                    ['file-invoice-dollar', 'Tax reports'],
                                    ['box-open', 'Inventory loss'],
                                    ['shuffle', 'Order mix-ups'],
                                    ['credit-card', 'Payment gaps'],
                                    ['users', 'Staff tracking']
                                ].map(([icon, label]) => {
                                    const sel = wData.discovery.painPoints.includes(label);
                                    return (
                                        <button key={label} onClick={() => toggleArr('discovery', 'painPoints', label)}
                                            style={{ padding: '10px 12px', borderRadius: var_radius, border: `1.5px solid ${sel ? 'var(--rose)' : 'var(--border)'}`, background: sel ? 'var(--rose-soft)' : '#fff', display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontFamily: 'DM Sans', transition: 'all 0.15s' }}>
                                            <I n={icon} size={13} style={{ color: sel ? 'var(--rose)' : 'var(--text-tertiary)' }} />
                                            <span style={{ fontSize: 12, fontWeight: 600, color: sel ? 'var(--rose)' : 'var(--text-primary)' }}>{label}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="card" style={{ padding: 16 }}>
                            <p className="section-lbl">Features pitched</p>
                            {[
                                ['Table & KOT management', 'Kitchen order tracking'],
                                ['Fast billing + tap pay', 'Contactless, split bills'],
                                ['DoorDash + Uber Eats sync', 'Unified order view'],
                                ['Inventory management', 'Stock alerts & tracking']
                            ].map(([title, sub]) => {
                                const sel = wData.discovery.features.includes(title);
                                return (
                                    <div key={title} className="survey-item" onClick={() => toggleArr('discovery', 'features', title)}>
                                        <div className={`fp-check ${sel ? 'active' : ''}`}>
                                            {sel && <I n="check" size={10} style={{ color: '#fff' }} />}
                                        </div>
                                        <div>
                                            <p style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-primary)' }}>{title}</p>
                                            <p style={{ fontSize: 12, color: 'var(--text-tertiary)', marginTop: 2 }}>{sub}</p>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>

                        <div className="card" style={{ padding: 16 }}>
                            <p className="section-lbl">Owner's reaction</p>
                            <div style={{ display: 'flex', gap: 8 }}>
                                {[
                                    { id: 'hot', label: 'Hot lead', color: 'var(--sage)', bg: 'var(--sage-soft)' },
                                    { id: 'warm', label: 'Warm', color: 'var(--amber-deep)', bg: 'var(--amber-soft)' },
                                    { id: 'cold', label: 'Not interested', color: 'var(--text-secondary)', bg: 'var(--surface-dim)' }
                                ].map(r => {
                                    const sel = wData.discovery.reaction === r.label;
                                    return (
                                        <button key={r.id} onClick={() => setWData({ ...wData, discovery: { ...wData.discovery, reaction: r.label }})}
                                            style={{ flex: 1, padding: '10px 4px', borderRadius: 12, border: `1.5px solid ${sel ? r.color : 'var(--border)'}`, background: sel ? r.bg : '#fff', fontSize: 12, fontWeight: 600, color: sel ? r.color : 'var(--text-primary)', cursor: 'pointer', transition: 'all 0.15s' }}>
                                            {r.label}

                            </div>

                            {wData.closing.nextStep && (
                                <div className="screen-fade">
                                    <p style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-tertiary)', marginBottom: 6 }}>Reason (Won / Lost / Delayed)</p>
                                    <input className="fp-input" placeholder="e.g. Needs partner signature" value={wData.closing.reason} onChange={e => setWData({ ...wData, closing: { ...wData.closing, reason: e.target.value } })} />
                                </div>
                            )}
                        </div>

                        <div className="card" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                                <p className="section-lbl" style={{ marginBottom: 0 }}>Conversation notes</p>
                                <button className={`mic-btn ${recordingField === 'visitNote' ? 'recording' : ''}`} onClick={() => handleVoice('visitNote')}>
                                    <I n="microphone" size={13} />
                                </button>
                            </div>
                            <textarea className="fp-input" rows="4" placeholder="Record final details, competitor mentions, or specific handover instructions…"
                                value={wData.visitNote} onChange={e => setWData({ ...wData, visitNote: e.target.value })} />
                        </div>
                    </div>
                )}


                {/* ───────────────────────────────────────────────────────────────── */}
                {/* SHARED SUMMARY (Step 5)                     */}
                {/* ───────────────────────────────────────────────────────────────── */}
                
                {!isColdVisit && wizardStep === 5 && (
                    <div className="screen-fade" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                        <div style={{ background: 'var(--ink)', borderRadius: 20, padding: '22px 18px', textAlign: 'center' }}>
                            <div style={{ width: 52, height: 52, borderRadius: '50%', background: 'var(--amber)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 12px' }}>
                                <I n="check" size={22} style={{ color: 'var(--ink)' }} />
                            </div>
                            <p style={{ fontSize: 16, fontWeight: 700, color: '#fff', marginBottom: 6 }}>{wData.visitType} logged — {activePlace.name}</p>
                            <p style={{ fontSize: 12, color: 'rgba(255,255,255,0.45)', fontFamily: 'DM Mono' }}>Synced · {fmtTime(visitTime)} · Auto-saved</p>
                        </div>

                        <div className="card" style={{ padding: 16 }}>
                            <p className="section-lbl">Visit summary</p>
                            
                            {/* Follow up summary array */}
                            {isFollowUpVisit && [
                                ['Contact', hasContact ? (wData.contactMode === 'new' ? wData.newContact.name : 'Existing contact') : 'No contact'],
                                ['Discussion', wData.followUp.discussionOutcome || 'None'],
                                ['Objections', wData.followUp.objections.length > 0 ? wData.followUp.objections.join(', ') : 'None', wData.followUp.objections.length > 0 ? { background: 'var(--rose-soft)', color: 'var(--rose)' } : null],
                                ['Next Action', wData.followUp.nextAction || 'None', wData.followUp.nextAction ? { background: 'var(--sky-soft)', color: 'var(--sky)' } : null]
                            ].map(([label, val, badge]) => (
                                <div key={label} className="summary-row">
                                    <span style={{ fontSize: 13, color: 'var(--text-secondary)' }}>{label}</span>
                                    {badge ? <span className="tag" style={badge}>{val}</span> : <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-primary)', textAlign: 'right' }}>{val}</span>}
                                </div>
                            ))}

                            {/* Demo summary array */}
                            {isDemoVisit && [
                                ['Contact', hasContact ? (wData.contactMode === 'new' ? wData.newContact.name : 'Existing contact') : 'No contact'],
                                ['Features shown', wData.demo.featuresShown.length > 0 ? wData.demo.featuresShown.length + ' features' : 'None'],
                                ['Need trial?', wData.demo.needTrial === true ? 'Yes' : wData.demo.needTrial === false ? 'No' : 'N/A', wData.demo.needTrial ? { background: 'var(--amber-soft)', color: 'var(--amber-deep)' } : null],
                                ['Reaction', wData.demo.reaction || 'None', wData.demo.reaction === 'Impressed' || wData.demo.reaction === 'Interested' ? { background: 'var(--sage-soft)', color: 'var(--sage)' } : wData.demo.reaction === 'Not convinced' ? { background: 'var(--rose-soft)', color: 'var(--rose)' } : null],
                                ['Next Action', wData.demo.nextStep || 'None', wData.demo.nextStep ? { background: 'var(--sky-soft)', color: 'var(--sky)' } : null]
                            ].map(([label, val, badge]) => (
                                <div key={label} className="summary-row">
                                    <span style={{ fontSize: 13, color: 'var(--text-secondary)' }}>{label}</span>
                                    {badge ? <span className="tag" style={badge}>{val}</span> : <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-primary)', textAlign: 'right' }}>{val}</span>}
                                </div>
                            ))}

                            {/* Closing summary array */}
                            {isClosingVisit && [
                                ['Contact', hasContact ? (wData.contactMode === 'new' ? wData.newContact.name : 'Existing contact') : 'No contact'],
                                ['Pricing agreed', wData.closing.pricingApproved ? 'Yes' : 'No'],
                                ['Contract signed', wData.closing.contractSigned ? 'Yes' : 'No', wData.closing.contractSigned ? { background: 'var(--sage-soft)', color: 'var(--sage)' } : { background: 'var(--surface-dim)', color: 'var(--text-secondary)' }],
                                ['Docs pending', wData.closing.kycPending.length > 0 ? wData.closing.kycPending.length + ' docs' : 'None', wData.closing.kycPending.length > 0 ? { background: 'var(--amber-soft)', color: 'var(--amber-deep)' } : null],
                                ['Next Action', wData.closing.nextStep || 'None', wData.closing.nextStep === 'Onboarding' ? { background: 'var(--sage-soft)', color: 'var(--sage)' } : wData.closing.nextStep === 'Lost follow-up' ? { background: 'var(--rose-soft)', color: 'var(--rose)' } : { background: 'var(--sky-soft)', color: 'var(--sky)' }]
                            ].map(([label, val, badge]) => (
                                <div key={label} className="summary-row">
                                    <span style={{ fontSize: 13, color: 'var(--text-secondary)' }}>{label}</span>
                                    {badge ? <span className="tag" style={badge}>{val}</span> : <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--text-primary)', textAlign: 'right' }}>{val}</span>}
                                </div>
                            ))}
                        </div>

                        <button className="btn-secondary" style={{ width: '100%', borderRadius: 14, background: 'var(--sky-soft)', color: 'var(--sky)', border: '1px solid rgba(58, 110, 168, 0.3)' }} onClick={() => showToast('Generating follow-up points...')}>
                            <I n="wand-magic-sparkles" size={14} style={{ marginRight: 4 }} /> Prep follow-up talking points
                        </button>
                    </div>
                )}
            </div>

            {/* Wizard Footer */}
            <div style={{ padding: '12px 16px 28px', background: '#fff', borderTop: '1px solid var(--border)', display: 'flex', gap: 10, flexShrink: 0 }}>
                {wizardStep > 0 && wizardStep < maxSteps
                    ? <button className="btn-secondary" style={{ borderRadius: 14 }} onClick={handlePrev}>Back</button>
                    : wizardStep === 0 && <button className="btn-secondary" style={{ borderRadius: 14 }} onClick={() => { setTimerOn(false); setScreen('detail'); }}>Cancel</button>
                }
                <button className="btn-primary" style={{ flex: 1, borderRadius: 14, background: wizardStep === maxSteps ? 'var(--sage)' : 'var(--ink)' }} onClick={handleNext}>
                    {nextText}
                    {wizardStep < maxSteps && <I n="arrow-right" size={14} style={{ color: 'rgba(255,255,255,0.6)' }} />}
                </button>
            </div>
        </div>
    );

    /* ═══════════════════════════════════════ MODALS ═══════════════════════════════════════ */
    const renderModal = () => {
        if (!modalType) return null;
        let noteTextRef = '';

        return (
            <div className="modal-backdrop" onClick={() => setModalType(null)}>
                <div className="modal-sheet hide-scroll" onClick={e => e.stopPropagation()}>
                    <div className="handle-bar" />
                    <div style={{ padding: '8px 20px 32px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                            <h3 style={{ fontSize: 20, fontWeight: 700, color: 'var(--text-primary)' }}>
                                {modalType === 'note' ? 'Quick note' : 'Add contact'}
                            </h3>
                            <button onClick={() => setModalType(null)}
                                style={{ width: 32, height: 32, borderRadius: '50%', background: 'var(--surface-dim)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: 'var(--text-secondary)' }}>
                                <I n="xmark" size={15} />
                            </button>
                        </div>

                        {modalType === 'note' && (
                            <>
                                <textarea className="fp-input" rows="4" placeholder="Brief details about this interaction…" style={{ marginBottom: 16 }}
                                    onChange={e => { noteTextRef = e.target.value; }} />
                                <button className="btn-primary" style={{ width: '100%', borderRadius: 14 }} onClick={() => handleAddNote(noteTextRef)}>
                                    Save note
                                </button>
                            </>
                        )}

                        {modalType === 'contact' && (() => {
                            let cn = '', cp = '', ce = '', cr = '';
                            return (
                                <>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 16 }}>
                                        <input className="fp-input" placeholder="Contact name" onChange={e => cn = e.target.value} />
                                        <input className="fp-input" type="tel" placeholder="Phone number" onChange={e => cp = e.target.value} />
                                        <input className="fp-input" type="email" placeholder="Email address" onChange={e => ce = e.target.value} />
                                        <input className="fp-input" placeholder="Role (e.g. Store Manager)" onChange={e => cr = e.target.value} />
                                    </div>
                                    <button className="btn-primary" style={{ width: '100%', borderRadius: 14 }} onClick={() => handleAddContact({ name: cn, phone: cp, email: ce, role: cr })}>
                                        Save contact
                                    </button>
                                </>
                            );
                        })()}
                    </div>
                </div>
            </div>
        );
    };

    return (
        <div style={{ width: '100%', height: '100%', background: '#E8E5DF', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0', fontFamily: 'DM Sans, sans-serif' }}>
            <div style={{
                width: '100%', maxWidth: 390,
                height: '100dvh', maxHeight: '92vh',
                background: 'var(--surface)',
                borderRadius: 48,
                overflow: 'hidden',
                display: 'flex', flexDirection: 'column',
                position: 'relative',
                border: '12px solid #1C1F26',
                boxShadow: '0 32px 80px rgba(0,0,0,0.35)',
                minHeight: 600,
            }}>
                {/* Dynamic island */}
                <div style={{ position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)', width: 120, height: 30, background: '#1C1F26', borderRadius: '0 0 20px 20px', zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'flex-end', paddingRight: 14 }}>
                    <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#0D0F14', border: '1px solid #2A2D38' }} />
                </div>

                {/* Toast */}
                <div className={`toast ${toast.show ? 'show' : ''}`}>{toast.msg}</div>

                {/* Screens */}
                {screen === 'directory' && renderDirectory()}
                {screen === 'detail' && renderDetail()}
                {screen === 'wizard' && renderWizard()}

                {/* Modals */}
                {renderModal()}

                {/* Home bar */}
                <div style={{ position: 'absolute', bottom: 6, left: '50%', transform: 'translateX(-50%)', width: '30%', height: 4, background: 'rgba(0,0,0,0.15)', borderRadius: 100, zIndex: 100, pointerEvents: 'none' }} />
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
